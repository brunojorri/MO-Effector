<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MO Effector</title>
<style>
html,body{margin:0;padding:0;background:#252525;color:#e7e7e7;font:12px Arial,sans-serif}#app{padding:14px}#head{border-bottom:1px solid #444;padding-bottom:12px;margin-bottom:12px;color:#20c4e8;font-size:18px;font-weight:bold}.sub{font-size:10px;color:#aaa;letter-spacing:1px;margin-bottom:8px}.box{background:#303030;border:1px solid #474747;padding:10px;margin:0 0 10px;border-radius:4px}.row{display:flex;gap:8px;margin-top:8px}.row label{flex:1;color:#bbb;font-size:11px}.row input{margin-top:4px;width:100%;box-sizing:border-box;background:#1e1e1e;border:1px solid #555;color:#fff;padding:6px}button{background:#00a7d1;color:white;border:0;padding:10px;width:100%;font-weight:bold;cursor:pointer}.hint{color:#bbb;line-height:1.4}.chip{display:inline-block;background:#1d4753;color:#c2f4ff;padding:4px 7px;margin:2px;border-radius:10px;font-size:10px}#status{color:#aaa;font-size:11px}</style></head>
<body><div id="app"><div id="head">MO EFFECTOR <span style="font-size:10px;color:#aaa">v0.2 CEP</span></div>
<div class="box"><div class="sub">GRID CLONER</div><div class="row"><label>Rows<input id="rows" type="text" value="4"></label><label>Columns<input id="cols" type="text" value="6"></label></div><div class="row"><label>Spacing X<input id="sx" type="text" value="160"></label><label>Spacing Y<input id="sy" type="text" value="160"></label></div></div>
<div class="box"><div class="sub">CREATE SYSTEM</div><p class="hint">Selecione uma camada 2D em uma composição e crie os clones.</p><button id="create">CREATE CLONER + EFFECTOR</button></div>
<div class="box"><div class="sub">EFFECTOR</div><span class="chip">Position</span><span class="chip">Scale</span><span class="chip">Rotation</span><span class="chip">Opacity</span><p class="hint">Mova MO Effector e ajuste os parâmetros em MO Controller.</p></div><div id="status">Pronto para criar um sistema.</div></div>
<script src="client/CSInterface.js"></script><script src="client/app.js"></script></body></html>
